related_posts: 3
title: Pelletteria
baseurl: "/pannellisolari2"
url: "https://cialdecompatibili-netizen.github.io"
email: ""
description: "Pelletteria artigianale: borse, zaini, valigeria, portafogli, cinture, giacche e scarpe in pelle per donna e per uomo."
footer_text: "&copy; 2026 Pelletteria"
minimal_mistakes_skin: default
search: true

# SEO globale
author:
  name: "Pelletteria"
  bio: "Borse, valigeria e accessori in pelle per donna e uomo."
  links:
    - label: "Scrivici"
      icon: "fas fa-fw fa-envelope"
      url: "/pannellisolari2/contatti/"

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
exclude:
  - vendor
  - docs

permalink: /:categories/:title/

timezone:

collections:
  negozio:
    output: true
    permalink: /negozio/:name/
  products:
    output: true
    permalink: /shop/:name/
  progetti:
    output: true
    permalink: /progetti/:name/

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

footer:
  links: []

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: products
    values:
      layout: product
      classes: wide
      share: true
  - scope:
      path: ""
      type: progetti
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

cms_homepage:

# E-commerce (porting da ecommercealfolio1). Interruttore: admin > Impostazioni > Abilita e-commerce. Solo true accende, chiave assente = spento.
# Spento = spariscono menu, carrello e script; pagine /negozio/ /carrello/ /ordine/ e schede mostrano 'non disponibile'. Prodotti e categorie restano salvati.
ecommerce: true
# Ordini (SMOKE TEST, nessun pagamento): il browser scrive una riga nel foglio Google chiamando questo Apps Script. Vuoto = il pulsante 'Invia richiesta d'ordine' resta spento.
ordini:
  tracker: ""
